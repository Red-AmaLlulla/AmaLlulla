<style id="page-style">
/* Layout: barra de navegación fija + secciones de una sola página; los cortes responsivos usan consultas de contenedor (#app) para que la vista previa de celular y tablet funcione dentro del editor */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --ink:#141A33; --muted:#585F7A; --line:#D9DDEA;
  --indigo:#2A3A8F; --indigo-soft:#E6E9F7; --cochinilla:#B8174F; --sun:#E0A21B; --on-accent:#FFFFFF;
  --ok:#00983F; --bad:#E20616; --warn:#FAB400; --imp:#2D2E83; --nv:#5F6577;
  --on-ok:#111111; --on-bad:#FFFFFF; --on-warn:#111111; --on-imp:#FFFFFF; --on-nv:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --logo-f:none; --logo-ff:invert(1);
  --radius:10px; --pill:999px; --fs:17px; --lh:1.6; --h1s:1; --h2s:1; --maxw:1120px; --sp:72px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1124; --surface:#151A35; --ink:#E8EBF7; --muted:#A2A8C3; --line:#29305A;
  --indigo:#93A3FF; --indigo-soft:#1E2550; --cochinilla:#FF6C9E; --sun:#F2BE4A; --on-accent:#0D1124; --nv:#A9AFC2; --on-nv:#111111; --logo-f:invert(1); --logo-ff:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1124; --surface:#151A35; --ink:#E8EBF7; --muted:#A2A8C3; --line:#29305A;
  --indigo:#93A3FF; --indigo-soft:#1E2550; --cochinilla:#FF6C9E; --sun:#F2BE4A; --on-accent:#0D1124; --nv:#A9AFC2; --on-nv:#111111; --logo-f:invert(1); --logo-ff:none; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:130px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:var(--lh)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
#app{container:app / inline-size;background:var(--bg)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:calc(clamp(1.8rem,4cqi,2.6rem) * var(--h2s));font-weight:800;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
a{color:var(--indigo)}
.rich ul,.rich ol{margin:.4em 0;padding-left:1.3em}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cochinilla);font-weight:600}
.lead{color:var(--muted);max-width:62ch}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:4px}
button{font:inherit;cursor:pointer}
.dp[hidden],.ebar[hidden],.etb[hidden]{display:none}
/* Botón «Colores de esta zona» (solo en modo edición) */
.zhost{position:relative}
.zbtn{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right,0px));z-index:6;border:1px solid #3A4262;background:#141826;color:#F1F3FA;border-radius:999px;padding:5px 11px;font:600 12px system-ui,-apple-system,sans-serif;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.zbtn:hover{background:#2B3150}
.zbtn.mid{top:50%;right:auto;left:50%;transform:translate(-50%,-50%)}
.secctl{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left,0px));z-index:6;display:flex;gap:4px;align-items:center;background:#141826;border:1px solid #3A4262;border-radius:999px;padding:3px;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.secctl button{border:none;background:#2B3150;color:#F1F3FA;border-radius:999px;width:28px;height:26px;font:700 13px system-ui,sans-serif}
.secctl select{width:auto;background:#2B3150;color:#F1F3FA;border:none;border-radius:999px;padding:4px 10px;font:600 12px system-ui,sans-serif}
.dp .pgbox{display:grid;gap:6px;border:1.5px dashed #2E3550;border-radius:12px;padding:8px}
.dp .pgbox.over{border-color:#F2BE4A;background:rgba(242,190,74,.06)}
.dp .pgh{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center}
.dp .pgh input{font-weight:700}
.dp .sec[draggable]{cursor:grab}
.dp .sec.drag{opacity:.45}
.dp .sec.over{border-color:#F2BE4A}
.dp .pgbox .sec .r1{grid-template-columns:auto auto 1fr auto auto}
.dp .sec .hd{color:#9AA3C7;font-size:16px;line-height:1;cursor:grab}
/* ===== Portada de noticias (Inicio) ===== */
section.block.news{padding-top:0}
section.news .wrap{padding-top:var(--sp)}
.nhead{display:grid;gap:8px;margin:44px 0 22px}
.nhead:first-child{margin-top:0}
.nrow{display:flex;align-items:center;gap:20px}
.nrow .nh{font-family:var(--f-display);font-size:1.15rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cochinilla);white-space:nowrap}
.nline{flex:1;height:2px;background:var(--line);min-width:30px}
.nlead{font-size:.95rem}
.nt{font-family:var(--f-news);font-weight:700;line-height:1.2;text-wrap:balance}
.nimg{background:center/cover no-repeat var(--line);border-radius:var(--radius);aspect-ratio:16/10;width:100%}
.nimg.sm{aspect-ratio:1/1;width:100%}
.nimg.comp{position:relative;overflow:hidden;isolation:isolate;background:#141414;display:grid;place-items:center;container-type:inline-size}
.nimg.comp .cbg{position:absolute;inset:0;background:center/cover no-repeat;filter:blur(18px) saturate(1.15) brightness(.62);transform:scale(1.25)}
.nimg.comp .cshade{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 50%,rgba(0,0,0,.5) 100%)}
.nimg.comp .cfg{position:relative;z-index:1;display:block;max-width:86%;max-height:86%;width:auto;height:auto;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.35),0 22px 44px -16px rgba(0,0,0,.75)}
.nimg.comp .clab{position:absolute;left:4%;top:5%;z-index:2;display:inline-flex;align-items:center;gap:.45em;background:var(--c);color:var(--c-on,#fff);padding:.5em .75em .45em .6em;border-radius:5px;font-size:clamp(.55rem,3.4cqi,1rem);box-shadow:0 6px 16px -6px rgba(0,0,0,.6)}
.nimg.comp .clab svg{width:1.05em;height:1.05em;flex:none}
.nimg.comp .clab b{font:800 1em/1 var(--f-display);letter-spacing:.09em;text-transform:uppercase}
.nimg.comp .clab.ex{background:#FFFFFF;color:#0A0A0A}
.nimg.comp .clab.sp{background:#0A0A0A;color:#FFFFFF;box-shadow:0 0 0 1.5px #fff,0 6px 16px -6px rgba(0,0,0,.6)}
.nimg.comp .csig{position:absolute;right:4%;bottom:5%;width:16%;max-width:120px;height:auto;z-index:2;opacity:.82;filter:invert(1)}
.ncard.hascomp .ntx > .ntag > .stamp{display:none}
.nimg.ph{background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 45%,#000) 100%);display:grid;place-items:center;overflow:hidden}
.nimg.ph span{font-family:var(--f-mono);font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.9);font-size:.85rem;border:2px solid rgba(255,255,255,.7);padding:4px 10px;border-radius:4px;transform:rotate(-4deg)}
.nimg.sm.ph span{font-size:.55rem;padding:2px 5px;letter-spacing:.06em}
.ntag{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.qctext{position:relative;display:grid;gap:14px;align-content:start;padding-bottom:clamp(28px,5vw,56px)}
.qclogo{width:min(100%,420px);height:auto;display:block;margin-bottom:6px}
#app .qchero .qceye{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--qcg);font-weight:600;margin:0}
#app.headauto .qchero h2,#app .qchero h2{color:#fff!important;margin:0;font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.12}
#app .qchero .qclead{color:rgba(255,255,255,.88);font-size:1.08rem;margin:0}
#app .qchero .qclangs{font-family:var(--f-mono);color:var(--qcg);font-weight:600;letter-spacing:.04em;margin:4px 0 0}
#app .qchero .qcnote{color:rgba(255,255,255,.7);font-size:.85rem;margin:0}
.qcart{position:relative;align-self:end;display:flex;justify-content:center}
.qchead{display:block;width:100%;max-width:440px;height:auto;filter:drop-shadow(0 0 28px rgba(118,232,120,.35))}
.qcname{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-top:28px;padding:22px 24px;border:1px solid var(--line);border-radius:var(--radius)}
.qcicon{width:64px;height:64px;padding:10px;background:var(--qcp);border-radius:12px;box-sizing:content-box}
.qcname h3{margin:0 0 4px}.qcname p{margin:0;color:var(--muted)}
.qcsec{margin-top:clamp(40px,6vw,64px)}
.qch{margin:0 0 18px}
.qcsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;counter-reset:none}
.qcsteps li{border-top:3px solid var(--qcp);padding-top:14px;display:grid;gap:6px;align-content:start}
.qcsteps .qk{font-family:var(--f-mono);font-weight:700;color:var(--qcp);font-size:.9rem}
#app .qcsteps h4{margin:0;font-family:var(--f-display);font-size:1.1rem;color:var(--head,var(--ink))}
.qcsteps p{margin:0;color:var(--muted);font-size:.95rem}
.qcrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center;margin-top:clamp(40px,6vw,64px)}
.qcrow.rev .qcfig{order:2}
.qcfig{margin:0;border-radius:var(--radius);overflow:hidden;line-height:0;background:#111}
.qcfig img{width:100%;height:auto;display:block}
.qcrow h3{margin:0 0 10px}.qcrow p{margin:0;color:var(--muted)}
.qcnums{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px;margin-top:clamp(40px,6vw,64px)}
.qcnums>div{display:grid;gap:4px;padding:18px 0 0;border-top:1px solid var(--line)}
.qcnums b{font-family:var(--f-display);font-size:clamp(2rem,4vw,2.8rem);line-height:1;color:var(--qcp)}
.qcnums span{color:var(--muted);font-size:.95rem}
.qccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:clamp(32px,5vw,48px)}
.qccards>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.qccards h3{margin:0 0 8px}.qccards p{margin:0;color:var(--muted)}
@media (max-width:820px){.qchero{grid-template-columns:1fr;padding-bottom:0}.qctext{padding-bottom:0}.qcart{max-width:320px;margin:0 auto}.qcrow{grid-template-columns:1fr}.qcrow.rev .qcfig{order:0}.qcname{align-items:start;gap:14px;padding:18px}.qcicon{width:36px;height:36px;padding:7px;border-radius:9px}}

/* Gestor GitHub: pantalla de entrada */
.ghl{position:fixed;inset:0;z-index:200;background:rgba(10,10,10,.72);display:grid;place-items:center;padding:16px;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.ghl form{background:#fff;color:#111;border-radius:16px;padding:26px 24px;width:min(420px,100%);display:grid;gap:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.ghl .ghlg{height:30px;width:auto;justify-self:start}
.ghl h2{margin:4px 0 0;font:800 1.4rem var(--f-display)}
.ghl p{margin:0;color:#555}
.ghl label{display:grid;gap:4px;font-weight:600;font-size:.85rem}
.ghl input[type=text],.ghl input[type=password]{font:inherit;padding:10px 12px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#111}
.ghl .ghr{display:flex;align-items:center;gap:8px;font-weight:500}
.ghl .ghr input{width:18px;height:18px;flex:none;margin:0;accent-color:#127864}
.ghl button{background:#127864;color:#fff;border:0;border-radius:999px;padding:11px 18px;font:700 15px system-ui;cursor:pointer}
.ghl button:disabled{opacity:.6}
.ghl .ghm{color:#B00020;font-size:.85rem;min-height:1em}
.ghl .ghh{font-size:.8rem;color:#777}
.ghout{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:70;background:#141826;color:#F1F3FA;border:0;border-radius:999px;padding:7px 12px;font:600 12px system-ui;cursor:pointer;opacity:.85}
#app input.search{background:#FFFFFF;color:#111111;border:1.5px solid #D3D6DE;color-scheme:light}
#app input.search::placeholder{color:#8B909C;opacity:1}
#app input.search:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:transparent}
.panel{max-width:820px;display:grid;gap:14px}
.panel:has(.members){max-width:none}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px;list-style:none;padding:0;margin:0}
.members li{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--bg);display:grid;gap:2px;align-content:start}
.members .n{font-family:var(--f-display);font-weight:700}
.members .d{color:var(--muted);font-size:.85rem}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:130px 1fr auto;gap:20px;padding:16px 0;border-bottom:1px dashed var(--line);align-items:start}
.timeline .f{font-family:var(--f-mono);font-size:.85rem;color:var(--cochinilla);font-weight:600}
@container app (max-width:560px){.timeline li{grid-template-columns:1fr;gap:4px}}

/* Cifras y gráficos */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:grid;gap:16px;align-content:start;min-width:0}
section.alt .chart{background:var(--bg)}
.chart .ct{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.chart .cn{font-size:.8rem;color:var(--muted)}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.hbar .l{min-width:0;overflow-wrap:anywhere}
.hbar .tr{height:14px;background:color-mix(in srgb,var(--line) 55%,transparent);border-radius:4px;overflow:hidden}
.hbar .fl{height:100%;border-radius:4px}
.hbar .v,.col .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:.82rem}
.colsw{overflow-x:auto}
.cols{display:flex;align-items:flex-end;gap:10px;height:220px;padding-top:20px;border-bottom:1px solid var(--line);min-width:min-content}
.col{flex:1 0 44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.col .fl{width:70%;max-width:56px;border-radius:4px 4px 0 0;min-height:2px}
.colx{display:flex;gap:10px;min-width:min-content}
.colx span{flex:1 0 44px;text-align:center;font-size:.75rem;color:var(--muted);line-height:1.2;padding-top:6px}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.88rem;min-width:0}
.legend li{display:flex;gap:8px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend b{font-family:var(--f-mono);font-weight:600;margin-left:auto;padding-left:10px}
.cempty{color:var(--muted);font-size:.9rem}
.chart{--expc:#111111;--spcc:#9A9A9A}
/* Titulares legibles: negro sobre fondos claros, blanco sobre oscuros (cada bloque marca su fondo con .on-dark / .on-light) */
#app{--head:#111111}
.on-light{--head:#111111;--expc:#111111}
.on-dark{--head:#FFFFFF;--expc:#FFFFFF}
/* Selva y Ande sobre fondos oscuros: acento arena y turquesa claro para que se lean bien */
#app section.on-dark{--cochinilla:#D9BF9C;--sun:#8FD1BE}
#app section.on-dark .btn.ghost{color:#8FD1BE;border-color:#8FD1BE}
#app.headauto :is(h1,h2,h3,.nt,.ct,.steptitle,.lang .n,.num b,.stat b,.hcard b,.acc summary,.acc .row .q,.person .n,.members .n,.reach .n,.steplist .n,.tbt b,.rcap2):not(.nh):not(.nbt):not(.rarr){color:var(--head)}
#app.headauto .donut text{fill:var(--head)}
#app.headauto .pagenav a{color:var(--head)}
#app.headauto .tab[aria-selected="true"]{background:var(--head);border-color:var(--head);color:var(--bg)}
#app.headauto .on-dark .tab[aria-selected="true"]{color:#111111}
.col .fl.stk{display:flex;flex-direction:column-reverse;overflow:hidden;background:none}
.legend.lrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.legend i{box-shadow:0 0 0 1px var(--line)}
.cedit{display:grid;gap:10px;font-size:.85rem}
.cedit .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cedit .dr{display:grid;grid-template-columns:1fr 90px auto;gap:6px;align-items:center}
.cedit select,.cedit input{padding:7px 9px;font-size:.85rem}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--c,var(--line));color:var(--ink);background:transparent;border-radius:var(--pill);padding:7px 14px;font-family:var(--f-mono);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.chip[style]::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));color:var(--c-on,var(--bg))}
.chip[aria-pressed="true"]::before{background:var(--c-on)}
.searchlbl{display:grid;gap:4px;flex:1 1 240px;max-width:340px;font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.search{padding:11px 16px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-family:var(--f-body);font-size:.95rem;text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;color:var(--ink);min-width:0;transition:transform .15s, box-shadow .15s}
button.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px rgba(20,26,51,.35)}
.card h3{font-size:1.08rem;line-height:1.3}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
/* Sellos de calificación: colores de marca Ama Llulla (rojo, amarillo, verde, índigo) como fondo; el texto toma negro o blanco según contraste */
.stamp{display:inline-block;border:2px solid var(--c);background:var(--c);color:var(--c-on,#fff);padding:3px 8px;border-radius:4px;font-family:var(--f-mono);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;transform:rotate(-2deg)}
/* Sello «Explicador»: negro con letras blancas sobre fondos claros; blanco con letras negras sobre fondos oscuros o fotos */
.stamp.exp{background:#111111;color:#FFFFFF;border-color:#111111}
.stamp.exp.on-dark{background:#FFFFFF;color:#111111;border-color:#FFFFFF}
/* Sello «Especial»: rectángulo con borde y letras (negro sobre fondo claro; blanco sobre oscuro o foto) */
.stamp.spc{background:transparent;color:#111111;border:2px solid #111111;letter-spacing:.14em}
.stamp.spc.on-dark{background:rgba(0,0,0,.35);color:#FFFFFF;border:2px solid #FFFFFF}
.sprow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
@container app (max-width:760px){.sprow{grid-template-columns:minmax(0,1fr);gap:0}}
.nmore{margin-top:36px}
section.spx .wrap.sponly{padding-top:28px}
section.spx .wrap.sponly > .vmore:first-child{margin-top:0}
section.spx{padding-bottom:0}
section.spx .wrap.sponly{padding-top:22px}
section.spx + section.news > .wrap{padding-top:44px}
section.spx:not(:has(> .wrap)) + section.news > .wrap{padding-top:44px}
/* Portada de informes especiales en Inicio: sombra suave en los bordes de la imagen (viñeta). No modifica la imagen guardada */
section.spx button.nbanner{box-shadow:inset 0 0 160px 40px rgba(0,0,0,.5)}
@container app (max-width:560px){section.spx button.nbanner{box-shadow:inset 0 0 80px 18px rgba(0,0,0,.5)}}
.vmore{display:flex;justify-content:center;margin-top:36px}
/* Menos espacio en blanco bajo los botones «Ver más …» al final de una sección */
#app section.block:has(> .wrap > .vmore:last-child){padding-bottom:40px}
#app section.block .wrap > .vmore:last-child{margin-top:28px}
.spban{position:relative}
.vmore.spov{display:block;position:absolute;left:0;right:0;bottom:34px;margin:0;pointer-events:none;z-index:2}
.vmore.spov .wrap{display:flex;justify-content:flex-end}
.vmore.spov .btn{pointer-events:auto;box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}
.spban button.nbanner .nbtx{max-width:min(900px,calc(100% - 240px))}
@container app (max-width:760px){.vmore.spov{top:14px;bottom:auto}.vmore.spov .btn{font-size:.82rem;padding:8px 14px}.spban button.nbanner .nbtx{max-width:none}}
.archg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 28px}
@container app (max-width:900px){.archg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container app (max-width:560px){.archg{grid-template-columns:minmax(0,1fr);gap:0}}
section.arch .wrap{padding-top:calc(var(--sp) * .6)}
section.arch h1.nh{font-size:1.15rem;margin:0}
section.arch .nhead{margin-top:20px}
section.spx:not(:has(> .wrap)){padding-bottom:0}
section.spx + section{border-top:none}
.more{font-family:var(--f-display);font-weight:700;color:var(--indigo);font-size:.9rem;margin-top:auto}
.empty{color:var(--muted);padding:24px 0}
.src{margin-top:20px;font-size:.85rem;color:var(--muted)}

dialog{border:none;border-radius:14px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,30,.6)}
.dlg{padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.dlg .x{align-self:flex-end;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--ink)}
dialog.lb{max-width:min(1100px,calc(100% - 32px));background:#0B0B0D;color:#F2F2F0}
dialog.lb .dlg{align-items:center;padding:16px}
dialog.lb img{max-height:78vh;width:auto;max-width:100%;border-radius:8px}
dialog.lb .x{color:#F2F2F0;border-color:#444}

.method{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.mtop{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:center;margin-bottom:56px}
.mtop>.head{margin-bottom:0}
.mtop .lead{max-width:none}
.mtop .stepper,.mtop .steplist{align-self:center}
@container app (max-width:860px){.mtop{grid-template-columns:minmax(0,1fr);gap:28px;margin-bottom:40px}}
.method>*{min-width:0}
@container app (max-width:860px){.method{grid-template-columns:1fr}}
.stepper{align-self:start;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.dots{display:flex;gap:6px;margin-bottom:18px}
.dots button{flex:1;height:6px;border-radius:3px;border:none;background:var(--line);padding:0}
.dots button.on{background:var(--indigo)}
.stepnum{font-family:var(--f-mono);color:var(--cochinilla);font-size:.8rem;font-weight:600}
.steptitle{font-family:var(--f-display);font-weight:700;font-size:1.4rem;margin:6px 0 10px}
.stepnav{display:flex;justify-content:space-between;margin-top:20px;gap:8px}
.stepnav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--pill);padding:8px 16px;font-family:var(--f-display)}
.stepnav button:disabled{opacity:.4;cursor:default}
.steplist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.steplist li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.steplist .k{font-family:var(--f-mono);color:var(--cochinilla);font-weight:600}
.steplist .n{font-family:var(--f-display);font-weight:700}
.steplist .d{color:var(--muted);font-size:.95rem}

.acc{border-top:1px solid var(--line)}
.acc details,.acc .row{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--f-display);font-weight:700}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-family:var(--f-mono);font-size:1.3rem;color:var(--muted)}
.acc details[open] summary::after{content:"−"}
.acc .body{padding:0 0 18px;color:var(--muted)}
.acc .row{padding:14px 0;display:grid;gap:6px}
.acc .row .q{font-family:var(--f-display);font-weight:700}

/* Idiomas: una sola fila con tantas columnas como idiomas (hasta 4); en tablet 2 por fila y en celular 1 */
.langs{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:24px}
@container app (max-width:900px){.langs{grid-template-columns:repeat(min(var(--n,3),2),minmax(0,1fr))}}
@container app (max-width:480px){.langs{grid-template-columns:minmax(0,1fr)}}
.ordctl{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ord{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:34px;height:28px;font:700 14px system-ui,sans-serif;cursor:pointer}
.ord:hover:not(:disabled){border-color:var(--sun);color:var(--sun)}
.ord:disabled{opacity:.35;cursor:default}
.ordctl .del{justify-self:auto;align-self:auto}
.lang{border-left:4px solid var(--c);padding:6px 0 6px 18px;min-width:0}
.lang .n{font-family:var(--f-display);font-size:1.4rem;font-weight:700;display:block}
.lang .d{color:var(--muted);font-size:.95rem;margin-top:4px}
.reach{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;margin-top:40px}
.reach>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:6px;align-content:start}
.reach .d{color:var(--muted);font-size:.95rem}

/* Mapa del Perú (Alcance) */
.regchart .pminfo{grid-template-columns:auto 1fr;column-gap:14px;row-gap:0;padding:12px 16px;min-height:0}
.regchart .pminfo .pmn{grid-row:span 2;font-size:2.4rem;align-self:center}
.regchart .pminfo .pml{align-self:end}.regchart .pminfo .pms{align-self:start}
.regchart .pminfo .pmmem,.pminfo .pmx{grid-column:1/-1}
.regchart .pminfo .pmmem{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;padding-top:8px}
.regchart .pmnat{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pmnt{font-size:.85rem;color:var(--muted);margin-right:2px}
.pmchip{font-size:.8rem;padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,#8FD1BE 45%,transparent);color:var(--head,var(--ink))}
.regchart .pmlist{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.regchart .pmlist li{padding:3px 6px;font-size:.84rem}
.regchart .pmside{gap:12px}
.regchart .pmh{text-transform:none;letter-spacing:0;font:400 .75rem var(--f-body);margin:0}

/* ===== Gestor de notas (paleta propia, independiente de la web) ===== */
.gm{position:fixed;inset:0;z-index:95;background:#F4F5F8;color:#1B1E28;display:grid;grid-template-rows:auto minmax(0,1fr);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
.gm[hidden]{display:none}
.gm button{font:inherit;cursor:pointer}
.gm button:disabled{opacity:.45;cursor:default}
.gm-top{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));background:#141826;color:#F1F3FA;flex-wrap:wrap}
.gm-top>b{font-size:17px}
.gm-st{margin-right:auto;font-size:13px;opacity:.8}
.gm .b1{background:#F2BE4A;color:#1a1300;border:none;border-radius:999px;padding:9px 16px;font-weight:700}
.gm .b2{background:#fff;color:#1B1E28;border:1px solid #C9CEDB;border-radius:999px;padding:8px 14px;font-weight:600}
.gm-top .b2{background:transparent;color:#F1F3FA;border-color:#5A6385}
.gm-ml{display:none}
.gm-main{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
.gm-list{border-right:1px solid #DDE1EA;background:#fff;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.gm-lh{padding:14px;display:grid;gap:10px;border-bottom:1px solid #EEF0F5}
.gm input,.gm textarea{font:inherit;color:#1B1E28;background:#fff;border:1px solid #C9CEDB;border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.gm textarea{resize:vertical}
.gm input:focus,.gm textarea:focus,.gm .rte:focus{outline:2px solid #2A3A8F;outline-offset:0;border-color:#2A3A8F}
.gm-seg{display:flex;background:#EEF0F5;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.gm-seg button{flex:1;border:none;background:none;border-radius:8px;padding:7px 8px;font-weight:600;font-size:13px;color:#4A5068}
.gm-seg button[aria-pressed=true]{background:#fff;color:#141826;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.gm-items{overflow-y:auto;padding:8px 8px 24px;display:grid;gap:2px;align-content:start}
.gm-it{all:unset;box-sizing:border-box;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:10px;border-radius:12px;cursor:pointer;width:100%}
.gm-it:hover{background:#F4F5F8}
.gm-it:focus-visible{outline:2px solid #2A3A8F}
.gm-it[aria-current=true]{background:#E6E9F7;box-shadow:inset 0 0 0 2px #2A3A8F}
.gm-th{width:64px;height:48px;border-radius:8px;background:#DDE1EA center/cover no-repeat}
.gm-it b{font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gm-it small{color:#6A7088;font-size:12px;display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.gm-form{overflow-y:auto;padding:24px clamp(16px,4vw,48px) 140px;min-height:0}
.gm-fi{max-width:820px;margin:0 auto;display:grid;gap:18px}
.gm-card{background:#fff;border:1px solid #DDE1EA;border-radius:16px;padding:20px;display:grid;gap:14px;min-width:0}
.gm-card h3{margin:0;font:700 16px system-ui,sans-serif;display:flex;gap:10px;align-items:center}
.gm-card h3 i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#141826;color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.gm-card h3 i.ok{background:#00983F}
.gm label{display:grid;gap:6px;font-weight:600;font-size:14px;min-width:0}
.gm .hint{font-weight:400;color:#6A7088;font-size:12.5px}
.gm .cnt{font-weight:400;color:#6A7088;font-size:12px;justify-self:end}
.gm .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gm .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gm-rt{display:flex;flex-wrap:wrap;gap:8px}
.gm-rt button{border:2px solid var(--c);background:#fff;color:#1B1E28;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.gm-rt button[aria-pressed=true]{background:var(--c);color:var(--c-on)}
.gm-drop{border:2px dashed #AEB5C8;border-radius:14px;padding:22px;text-align:center;color:#4A5068;cursor:pointer;display:grid;gap:6px;place-items:center}
.gm-drop:hover,.gm-drop.over{border-color:#2A3A8F;background:#E6E9F7}
.gm-drop img{max-height:240px;max-width:100%;border-radius:10px}
.gm-tb{display:flex;flex-wrap:wrap;gap:4px;background:#F4F5F8;border:1px solid #C9CEDB;border-bottom:none;border-radius:12px 12px 0 0;padding:6px;position:sticky;top:-24px;z-index:2}
.gm-tb button{background:#fff;border:1px solid #DDE1EA;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:#1B1E28}
.gm-tb button:hover{background:#E6E9F7}
.gm-tb .lk{display:flex;gap:4px;flex:1 1 260px}
.gm-tb .lk[hidden]{display:none}
.gm-tb .lk input{padding:6px 8px;border-radius:8px}
.gm .rte{min-height:320px;border:1px solid #C9CEDB;border-radius:0 0 12px 12px;padding:16px 18px;background:#fff;font:17px/1.65 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}

.gm .rte h2{font:700 22px/1.25 system-ui,sans-serif;margin:18px 0 8px}
.gm .rte h3{font:700 18px/1.3 system-ui,sans-serif;margin:14px 0 6px}
.gm .rte p{margin:0 0 12px}
.gm .rte blockquote{margin:12px 0;border-left:4px solid #F2BE4A;padding:4px 14px;color:#4A5068;font-style:italic}
.gm .rte img{max-width:100%;border-radius:8px;display:block}
.gm .rte figure{margin:14px 0}
.gm .rte figcaption{font:13px system-ui,sans-serif;color:#6A7088;margin-top:4px}
.gm .rte a{color:#2A3A8F}
.gm-src{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.gm .x{border:1px solid #F0B4BA;background:#fff;color:#B0000E;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;justify-self:start}
.gm-chk{display:flex!important;gap:10px;align-items:center;font-weight:500!important}
.gm-chk input{width:18px;height:18px;accent-color:#2A3A8F;flex:none}
.gm code{background:#EEF0F5;border-radius:6px;padding:2px 6px;font-size:12px;overflow-wrap:anywhere}
.gm-act{position:fixed;left:340px;right:0;bottom:0;background:#fff;border-top:1px solid #DDE1EA;padding:12px clamp(16px,4vw,48px);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:3;box-shadow:0 -8px 24px -16px rgba(0,0,0,.3)}
.gm-prog{margin-right:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:#4A5068;min-width:0}
.gm-bar{width:110px;height:8px;border-radius:4px;background:#EEF0F5;overflow:hidden;flex:none}
.gm-bar i{display:block;height:100%;background:#00983F;transition:width .2s}
.gm-miss{font-size:12.5px}
.gm-empty{display:grid;place-items:center;text-align:center;color:#4A5068;gap:12px;padding:80px 20px}
@media (max-width:820px){
  .gm-ml{display:inline-block}
  .gm-main{grid-template-columns:minmax(0,1fr)}
  .gm-list{display:none;border-right:none}
  .gm.showlist .gm-list{display:grid}
  .gm.showlist .gm-form,.gm.showlist .gm-act{display:none}
  .gm-act{left:0}
  .gm .row2,.gm .row3,.gm-src{grid-template-columns:minmax(0,1fr)}
  .gm-top>b,.gm-st{display:none}
  .gm-top{gap:8px}
  .gm-top .gm-ml{margin-right:auto}
  .gm-act{gap:8px;padding-top:10px}
  .gm-act .b1,.gm-act .b2{padding:7px 12px;font-size:13.5px}
  .gm-prog{flex-basis:100%}
  .gm-form{padding-bottom:180px}

/* Elige la versión del sello «Explicador» según el fondo real que tiene detrás */
function expStamps(){
  const rgb = s => (s.match(/[\d.]+/g)||[]).map(Number);
  document.querySelectorAll("#app .stamp.exp, #app .stamp.spc").forEach(st => {
    let dark = false;
    for (let e = st.parentElement; e; e = e.parentElement){
      const cs = getComputedStyle(e);
      if (cs.backgroundImage && cs.backgroundImage !== "none" && !e.classList.contains("stamp")){ dark = true; break; }
      const c = rgb(cs.backgroundColor);
      if (c.length >= 3 && (c.length < 4 || c[3] > .5)){ const L = (.2126*c[0] + .7152*c[1] + .0722*c[2]) / 255; dark = L < .5; break; }
      if (e === document.body){ break; }
    }
    st.classList.toggle("on-dark", dark);
  });
  document.querySelectorAll("#app main > *, #app main > section > .wrap, #app footer, #app :is("+CARD_SEL+")").forEach(el => {
    let dark = null;
    for (let e = el; e; e = e.parentElement){
      const cs = getComputedStyle(e);
      if (cs.backgroundImage && cs.backgroundImage !== "none" && /url\(/.test(cs.backgroundImage)){ dark = true; break; }
      const c = rgb(cs.backgroundColor);
      if (c.length >= 3 && (c.length < 4 || c[3] > .5)){ dark = (.2126*c[0] + .7152*c[1] + .0722*c[2]) / 255 < .5; break; }
    }
    el.classList.toggle("on-dark", dark === true); el.classList.toggle("on-light", dark === false);
  });
}

function parseRows(txt){
  const lines = txt.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  if (!lines.length) return [];
  const sep = lines[0].includes("\t") ? "\t" : (lines[0].split(";").length > lines[0].split(",").length ? ";" : ",");
  const split = l => { const out=[]; let cur="", q=false; for (let i=0;i<l.length;i++){ const ch=l[i]; if (q){ if (ch==='"'){ if (l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; } else if (ch==='"') q=true; else if (ch===sep){ out.push(cur); cur=""; } else cur+=ch; } out.push(cur); return out.map(s=>s.trim()); };
  return lines.map(split);
}

/* Las imágenes pegadas dentro del texto (desde Word, Docs o la web) se reducen a 1100 px en JPEG para que la página no pese demasiado */
async function shrinkBodyImgs(box){
  let changed = false;
  for (const img of box.querySelectorAll('img[src^="data:image"]')){
    const src = img.getAttribute("src"); if (src.length < 180000) continue;
    try {
      const im = new Image(); im.src = src; await im.decode();
      const k = Math.min(1, 1100 / im.naturalWidth), cv = document.createElement("canvas");
      cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
      const x = cv.getContext("2d"); x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(im, 0, 0, cv.width, cv.height);
      const out = cv.toDataURL("image/jpeg", .8);
      if (out.length < src.length){ img.setAttribute("src", out); changed = true; }
    } catch(e){}
  }
  return changed;
}

let msg = "";
function bar(){
  const b = document.getElementById("ebar");
  b.textContent = "";
  if (!art || readOnly){ b.hidden = !readOnly; if (readOnly){ b.className="ebar"; b.append(h("span",{class:"st"},"Solo lectura: no tienes permiso para editar esta página.")); setTimeout(()=>{b.hidden=true;},5000);} return; }
  b.hidden = false;
  if (gmOpen) gmProg();
  if (!editing){
    b.className = "ebar solo";
    b.append(h("button",{class:"go",type:"button",onclick:()=>{editing=true;msg="";render();}},"✎ Editar página"),
      h("button",{class:"go",type:"button",onclick:()=>{msg="";openGM(ui.note && findNote(ui.note) ? findNote(ui.note).col : "checks", ui.note);}},"📝 Notas"));
    return;
  }
  b.className = "ebar";
  const dev = h("div",{class:"grp2",role:"group","aria-label":"Vista previa"},[["desktop","PC","Escritorio"],["tablet","Tablet","Tablet"],["mobile","Móvil","Celular"]].map(([k,i,t])=>
    h("button",{type:"button",title:"Vista "+t,"aria-label":"Vista "+t,"aria-pressed":String(ui.device===k),onclick:()=>{ui.device=k;render();}},i)));
  b.append(h("span",{class:"st"}, msg || (saving ? "Guardando…" : dirty ? "Cambios sin guardar" : "Sin cambios")),
    h("button",{class:"ic",type:"button",title:"Deshacer (Ctrl+Z)","aria-label":"Deshacer",disabled:HI===0&&!histT,onclick:undo},"↶"),
    h("button",{class:"ic",type:"button",title:"Rehacer (Ctrl+Y)","aria-label":"Rehacer",disabled:HI>=HIST.length-1,onclick:redo},"↷"),
    dev,
    h("button",{type:"button",onclick:()=>openGM(ui.note && findNote(ui.note) ? findNote(ui.note).col : "checks", ui.note)},"📝 Notas"),
    h("button",{type:"button","aria-pressed":String(panel),onclick:()=>{panel=!panel;renderPanel();bar();}},"🎨 Diseño"),
    h("button",{class:"cancel",type:"button",disabled:saving,onclick:()=>{S=JSON.parse(SNAP);HIST=[SNAP];HI=0;dirty=false;editing=false;panel=false;if(gmOpen){gmOpen=false;const gq=document.getElementById("gm");gq.hidden=true;gq.textContent="";document.body.style.overflow="";}ui.device="desktop";msg="";render();}},dirty?"Descartar":"Salir"),
    h("button",{class:"save",type:"button",disabled:saving||!dirty,onclick:save},"Guardar"));
}
function esc(s){ return s.replace(/</g,"\\u003c").replace(/>/g,"\\u003e").replace(/&/g,"\\u0026"); }
const attr = s => String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const FONTS_URL = "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Mono:wght@400;600&display=swap";
const C_ = "<"+"/";
function bodyParts(){
  const style = document.getElementById("page-style").textContent;
  const shell = document.getElementById("shell").innerHTML;
  return {style, shell, state:'<script type="application/json" id="state">'+esc(JSON.stringify(S))+C_+'script>\n\n',
    script:'\n<script id="app-script">'+SRC+C_+'script>\n', tpl:'<template id="shell">'+shell+C_+'template>\n'};
}
function buildDoc(){
  const reset = (document.head.querySelector("style")||{}).textContent || "";
  const p = bodyParts();
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+C_+'style>'+C_+'head><body>'
   + '<title>Red Ama Llulla'+C_+'title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
   + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
   + '<link rel="stylesheet" href="'+FONTS_URL+'">\n'
   + '<style id="page-style">'+p.style+C_+'style>\n\n' + p.state + p.shell + p.script + p.tpl + C_+'body>'+C_+'html>';
}
function buildExport(){
  const O = S.seo, p = bodyParts(), base = O.url.replace(/\/+$/,"");
  const ogImg = O.img ? (base ? base+"/og-image.jpg" : "og-image.jpg") : "";
  const reset = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  return '<!doctype html>\n<html lang="es-PE">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'
   + '<title>'+attr(O.title)+C_+'title>\n'
   + (O.desc ? '<meta name="description" content="'+attr(O.desc)+'">\n' : '')
   + (base ? '<link rel="canonical" href="'+attr(base+"/")+'">\n' : '')
   + '<meta property="og:type" content="website">\n<meta property="og:locale" content="es_PE">\n<meta property="og:title" content="'+attr(O.title)+'">\n'
   + (O.desc ? '<meta property="og:description" content="'+attr(O.desc)+'">\n' : '')
   + (base ? '<meta property="og:url" content="'+attr(base+"/")+'">\n' : '')
   + (ogImg ? '<meta property="og:image" content="'+attr(ogImg)+'">\n<meta name="twitter:card" content="summary_large_image">\n' : '<meta name="twitter:card" content="summary">\n')
   + '<link rel="icon" type="image/png" href="'+LOGOS.sb+'">\n'
   + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="'+FONTS_URL+'">\n'
   + '<style>'+reset+C_+'style>\n<style id="page-style">'+p.style+C_+'style>\n'+C_+'head>\n<body>\n'
   + p.state + p.shell + p.script + p.tpl + C_+'body>\n'+C_+'html>\n';
}
async function save(){
  if (!art || saving) return;
  pushHist(); hideTB();
  saving = true; msg = ""; bar();
  if (GHC){
    try { await ghSave(); saving = false; dirty = false; SNAP = JSON.stringify(S); HIST = [SNAP]; HI = 0; msg = "Publicado. La web se actualiza en 1 o 2 minutos."; render(); }
    catch(e){ saving = false; msg = e && e.msg ? e.msg : "No se pudo publicar. Revisa tu conexión y vuelve a intentarlo."; bar(); }
    return;
  }
  try { await art.publish(buildDoc()); msg = "Guardado. Recargando…"; bar(); }
  catch(e){
    saving = false;
    const c = e && e.code;
    if (c === "conflict") msg = "Otra persona guardó antes. La página se recargará con su versión.";
    else if (["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].includes(c)){ readOnly = true; editing = false; panel = false; S = JSON.parse(SNAP); dirty=false; render(); return; }
    else if (c === "too_large") msg = "La página pesa demasiado. Usa imágenes más livianas.";
    else if (c === "rate_limited") msg = "Demasiados guardados seguidos. Espera un momento.";
    else msg = "No se pudo guardar. Revisa tu conexión y vuelve a intentarlo.";
    bar();
  }
}


/* ===================== Gestor conectado a GitHub ===================== */
const GH_API = "https://api.github.com";
let ghTok = "", ghRepo = null, ghBase = null, ghKnown = new Map();
function ghCfg(){
  const c = Object.assign({branch:"main"}, GHC);
  let st = {}; try { st = JSON.parse(localStorage.getItem("amaGH")||"{}"); } catch(e){}
  if (!c.owner && st.owner) c.owner = st.owner;
  if (!c.repo && st.repo) c.repo = st.repo;
  const m = location.hostname.match(/^([\w-]+)\.github\.io$/i);
  if (!c.owner && m) c.owner = m[1];
  if (!c.repo && m){ const seg = location.pathname.split("/").filter(Boolean); c.repo = (seg[0] && seg[0] !== "gestor") ? seg[0] : m[1]+".github.io"; }
  return c;
}
async function gh(path, opt){
  const r = await fetch(GH_API + path, Object.assign({}, opt, {headers:Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+ghTok,"X-GitHub-Api-Version":"2022-11-28"}, opt && opt.body ? {"Content-Type":"application/json"} : {})}));
  if (!r.ok){ const e = new Error("gh "+r.status); e.status = r.status; try { e.body = await r.json(); } catch(x){} throw e; }
  return r.status === 204 ? null : r.json();
}
const b64utf8 = str => { const u = new TextEncoder().encode(str); let s = ""; for (let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(s); };
const utf8b64 = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,"")), c => c.charCodeAt(0)));
async function sha1hex(str){ const d = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(str)); return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,20); }
async function ghLoad(){
  const c = ghRepo;
  const ref = await gh("/repos/"+c.owner+"/"+c.repo+"/git/ref/heads/"+c.branch);
  ghBase = ref.object.sha;
  const f = await gh("/repos/"+c.owner+"/"+c.repo+"/contents/datos.json?ref="+ghBase);
  let txt;
  if (f.content) txt = utf8b64(f.content);
  else { const bl = await gh("/repos/"+c.owner+"/"+c.repo+"/git/blobs/"+f.sha); txt = utf8b64(bl.content); }
  S = JSON.parse(txt); fill(); SNAP = JSON.stringify(S); HIST = [SNAP]; HI = 0; dirty = false;
}
async function ghSave(){
  const c = ghRepo, R = "/repos/"+c.owner+"/"+c.repo;
  const ref = await gh(R+"/git/ref/heads/"+c.branch);
  if (ref.object.sha !== ghBase) throw {msg:"Otra persona publicó cambios mientras editabas. Copia lo que necesites, recarga el gestor y vuelve a publicar."};
  /* Separa las imágenes nuevas (data:) en archivos dentro de img/ */
  let json = JSON.stringify(S, null, 1);
  const found = json.match(/data:image\/(png|jpeg|webp|gif|svg\+xml);base64,[A-Za-z0-9+\/=]+/g) || [];
  const tree = [];
  for (const d of [...new Set(found)]){
    let path = ghKnown.get(d);
    if (!path){
      const ext = {"png":"png","jpeg":"jpg","webp":"webp","gif":"gif","svg+xml":"svg"}[d.slice(11, d.indexOf(";"))] || "img";
      path = "img/" + (await sha1hex(d)) + "." + ext;
      const blob = await gh(R+"/git/blobs",{method:"POST",body:JSON.stringify({content:d.slice(d.indexOf(",")+1),encoding:"base64"})});
      tree.push({path, mode:"100644", type:"blob", sha:blob.sha});
      ghKnown.set(d, path);
    }
    json = json.split(d).join(path);
  }
  const data = await gh(R+"/git/blobs",{method:"POST",body:JSON.stringify({content:b64utf8(json),encoding:"base64"})});
  tree.push({path:"datos.json", mode:"100644", type:"blob", sha:data.sha});
  const base = await gh(R+"/git/commits/"+ghBase);
  const nt = await gh(R+"/git/trees",{method:"POST",body:JSON.stringify({base_tree:base.tree.sha, tree})});
  const who = (ghRepo.login ? ghRepo.login : "gestor");
  const cm = await gh(R+"/git/commits",{method:"POST",body:JSON.stringify({message:"Actualización desde el gestor ("+who+")", tree:nt.sha, parents:[ghBase]})});
  await gh(R+"/git/refs/heads/"+c.branch,{method:"PATCH",body:JSON.stringify({sha:cm.sha})});
  ghBase = cm.sha;
}
function ghLogin(err){
  const c = ghCfg();
  const box = h("div",{class:"ghl",role:"dialog","aria-label":"Entrar al gestor"});
  const own = h("input",{type:"text",value:c.owner||"",placeholder:"usuario u organización",autocomplete:"off"});
  const rep = h("input",{type:"text",value:c.repo||"",placeholder:"amallulla",autocomplete:"off"});
  const tok = h("input",{type:"password",placeholder:"github_pat_…",autocomplete:"off"});
  const rem = h("input",{type:"checkbox"});
  const st = h("p",{class:"ghm"}, err || "");
  const go = h("button",{type:"submit"},"Entrar");
  box.append(h("form",{onsubmit:async e=>{ e.preventDefault(); go.disabled = true; st.textContent = "Comprobando…";
      ghTok = tok.value.trim(); ghRepo = {owner:own.value.trim(), repo:rep.value.trim(), branch:c.branch};
      try {
        const info = await gh("/repos/"+ghRepo.owner+"/"+ghRepo.repo);
        if (!info.permissions || !info.permissions.push) throw {msg:"Tu clave no tiene permiso para publicar en este repositorio."};
        try { const u = await gh("/user"); ghRepo.login = u.login; } catch(x){}
        try { localStorage.setItem("amaGH", JSON.stringify({owner:ghRepo.owner, repo:ghRepo.repo})); if (rem.checked) localStorage.setItem("amaGHt", ghTok); } catch(x){}
        await ghLoad(); box.remove(); ghReady();
      } catch(x){ go.disabled = false; st.textContent = x && x.msg ? x.msg : x && x.status === 401 ? "La clave no es válida o venció." : x && x.status === 404 ? "No se encontró el repositorio, o tu clave no tiene acceso a él." : "No se pudo conectar con GitHub."; }
    }},
    h("img",{src:LOGOS.hb,alt:"Ama Llulla",class:"ghlg"}),
    h("h2",null,"Gestor de la web"),
    h("p",null,"Entra con tu clave de GitHub para escribir y publicar notas."),
    h("label",null,"Cuenta del repositorio",own),
    h("label",null,"Nombre del repositorio",rep),
    h("label",null,"Tu clave de acceso de GitHub",tok),
    h("label",{class:"ghr"},rem,"Recordar en este equipo"),
    go, st,
    h("p",{class:"ghh"},"Cada editor usa su propia clave. Si no tienes una, pídela a la coordinación o revisa la guía.")));
  document.body.append(box); setTimeout(()=>tok.focus(),50);
}
function ghReady(){
  art = {publish:()=>Promise.resolve()};
  render(); bar();
  const out = h("button",{class:"ghout",type:"button",title:"Salir del gestor",onclick:()=>{ try { localStorage.removeItem("amaGHt"); } catch(e){} location.reload(); }},"Salir ("+(ghRepo.login||"gestor")+")");
  document.body.append(out);
}
async function ghStart(){
  if (GHC.mode !== "gestor") return;
  let t = ""; try { t = localStorage.getItem("amaGHt") || ""; } catch(e){}
  const c = ghCfg();
  if (t && c.owner && c.repo){
    ghTok = t; ghRepo = {owner:c.owner, repo:c.repo, branch:c.branch};
    try { try { const u = await gh("/user"); ghRepo.login = u.login; } catch(x){} await ghLoad(); ghReady(); return; }
    catch(e){ try { localStorage.removeItem("amaGHt"); } catch(x){} }
  }
  ghLogin();
}
